# k8s/prometheus-configmap.yaml
# ─────────────────────────────────────────────────────────────────────────────
# AMA-Metrics (Azure Monitor Agent) Prometheus scraping configuration.
# This ConfigMap tells the managed Prometheus agent how to scrape the
# /metrics endpoint exposed by QRForge frontend pods.
#
# After applying, the metrics will appear in the Azure Monitor workspace
# and can be queried via the Metrics Explorer or used in dashboard tiles.
#
# Apply to the correct namespace (kube-system for AMA):
#   kubectl apply -f k8s/prometheus-configmap.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-prometheus-config
  namespace: kube-system    # AMA-Metrics agent reads from kube-system
data:
  prometheus-config: |
    # ── Scrape configuration for QRForge frontend pods ──────────
    # The AMA-Metrics agent will scrape any pod annotated with:
    #   prometheus.io/scrape: "true"
    #   prometheus.io/port: "3000"
    #   prometheus.io/path: "/metrics"
    #
    # The deployment.yaml already has these annotations set.
    # This configmap makes the agent aware of the annotation-based discovery.
    scrape_configs:
      - job_name: qrforge-frontend
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - qrforge
        relabel_configs:
          # Only scrape pods with prometheus.io/scrape: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # Use the port from the annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: "${1}:${2}"
            # (ioredis address is overridden below)
          - source_labels: [__meta_kubernetes_pod_ip,
                            __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: (.+);(.+)
            replacement: "$1:$2"
            target_label: __address__
          # Use the path from the annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Carry useful k8s labels into every metric series
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
        scrape_interval: 30s
        scrape_timeout:  10s
